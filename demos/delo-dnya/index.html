<style>
/* Layout: игра на один экран телефона. Заставка с дождём → дом в темноте (ищем улики фонариком) → допрос-поединок (предъяви улику на ложь) → печать результата. Единая тёмная тема намеренно. */
:root {
  --bg: #0b0a09; --panel: #171411; --panel2: #221d17; --ink: #f1e7d3; --muted: #9c917c; --line: #352e25;
  --red: #e0402f; --gold: #e3b04b; --cyan: #6fd2ff;
  --font-d: "Oswald", "Arial Narrow", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 var(--font-d); overflow: hidden; touch-action: manipulation; }
.screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.screen.on { display: flex; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { min-height: 54px; padding: 0 22px; border: 0; border-radius: 14px; background: var(--red); color: #fff; font: 700 18px var(--font-d); letter-spacing: .08em; text-transform: uppercase; }
.btn.gold { background: var(--gold); color: #1a1205; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn:active { transform: scale(.97); }

/* ===== Заставка ===== */
#intro { justify-content: flex-end; align-items: center; text-align: center; gap: 18px; background: radial-gradient(90% 60% at 50% 30%, #2a2219, var(--bg) 70%); }
#rain { position: absolute; inset: 0; width: 100%; height: 100%; }
#flash { position: absolute; inset: 0; background: #dfe8ff; opacity: 0; pointer-events: none; }
.intro-in { position: relative; display: grid; gap: 16px; justify-items: center; width: 100%; max-width: 420px; padding-bottom: 6vh; }
.no { font: 700 14px var(--mono); letter-spacing: .3em; color: var(--gold); }
.title { font: 700 clamp(46px, 14vw, 72px)/0.92 var(--font-d); text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 4px 30px rgba(224,64,47,.35); }
.title span { color: var(--red); display: block; }
.icons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.icons div { background: rgba(23,20,17,.85); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; display: grid; gap: 2px; }
.icons i { font-style: normal; font-size: 24px; }
.icons b { font: 700 18px var(--mono); }
.icons small { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.intro-in .btn { width: 100%; }

/* ===== Верхняя панель ===== */
.hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
.hearts { font-size: 20px; letter-spacing: 2px; }
.hearts .lost { filter: grayscale(1) opacity(.3); }
.clues { font: 700 13px var(--mono); color: var(--gold); }
.seg { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin: 8px 0; }
.seg button { flex: 1; min-height: 42px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 700 14px var(--font-d); letter-spacing: .08em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); }

/* ===== Дом в темноте ===== */
.scene-wrap { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #1c1813; touch-action: none; }
.scene-wrap svg.plan { position: absolute; inset: 0; width: 100%; height: 100%; }
.dark { position: absolute; inset: 0; background: rgba(4,4,6,.965); pointer-events: none;
  -webkit-mask-image: radial-gradient(circle var(--r, 72px) at var(--x, 50%) var(--y, 60%), transparent 0 60%, #000 100%);
  mask-image: radial-gradient(circle var(--r, 72px) at var(--x, 50%) var(--y, 60%), transparent 0 60%, #000 100%); transition: background .6s; }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font: 700 12px var(--mono); letter-spacing: .08em; color: var(--muted); background: rgba(11,10,9,.8); padding: 7px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none; transition: opacity .5s; }
.spot { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; font-size: 26px; opacity: 0; transform: scale(.6); transition: opacity .3s, transform .3s; pointer-events: none; }
.spot.seen { opacity: 1; transform: scale(1); pointer-events: auto; animation: pulse 1.4s infinite; }
.spot.got { opacity: .35; transform: scale(.8); animation: none; pointer-events: none; filter: grayscale(1); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(227,176,75,.7); } 50% { box-shadow: 0 0 0 14px rgba(227,176,75,0); } }
.bag { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; min-height: 64px; scrollbar-width: none; }
.bag::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font: 700 13px var(--font-d); letter-spacing: .03em; }
.chip i { font-style: normal; font-size: 20px; }
.chip.empty { color: var(--muted); border-style: dashed; }
.chip[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; background: var(--panel2); }
.chip.new { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.3) translateY(-60px); opacity: 0; } }
.fly { position: fixed; z-index: 30; font-size: 34px; pointer-events: none; transition: transform .7s cubic-bezier(.5,0,.3,1), opacity .7s; }
.card { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 25; width: min(92vw, 400px); background: var(--panel2); border: 1px solid var(--gold); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; transition: .35s; pointer-events: none; }
.card.show { opacity: 1; transform: translate(-50%, 0); }
.card.top { bottom: auto; top: calc(110px + env(safe-area-inset-top, 0px)); }
.card i { font-style: normal; font-size: 32px; }
.card b { display: block; font: 700 16px var(--font-d); letter-spacing: .04em; text-transform: uppercase; color: var(--gold); }
.card span { font: 500 14px/1.35 var(--mono); }

/* ===== Допрос ===== */
.suspects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sp { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 6px 4px; display: grid; justify-items: center; gap: 2px; }
.sp[aria-pressed="true"] { border-color: var(--gold); background: var(--panel2); }
.sp b { font: 700 13px var(--font-d); letter-spacing: .04em; text-transform: uppercase; }
.sp small { font: 500 11px var(--mono); color: var(--muted); }
.sp svg { width: 34px; height: 34px; }
.face-stage { position: relative; flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; margin-top: 8px; }
.portrait { display: grid; place-items: center; position: relative; min-height: 0; overflow: hidden; padding-bottom: 18px; }
.portrait svg { height: 100%; max-height: 230px; width: auto; max-width: 60vw; transition: transform .3s; }
.portrait.shake svg { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px) rotate(-3deg); } 40%, 80% { transform: translateX(10px) rotate(3deg); } }
.nerves { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center; gap: 6px; align-items: center; font: 700 11px var(--mono); color: var(--muted); letter-spacing: .1em; }
.nerves i { width: 26px; height: 6px; border-radius: 3px; background: var(--line); }
.nerves i.on { background: var(--red); box-shadow: 0 0 8px var(--red); }
.bubble { position: relative; background: var(--ink); color: #15110c; border-radius: 18px; padding: 12px 14px; font: 700 17px/1.25 var(--font-d); text-align: center; min-height: 64px; display: grid; place-items: center; }
.bubble::before { content: ""; position: absolute; top: -10px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--ink); }
.bubble.lie { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 3px; color: #6d6253; }
.bubble.react { background: #ffd9d2; }
.talkrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 6px; align-items: center; }
.nav { display: flex; justify-content: center; }
.talkrow > button { width: 40px; height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 20px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ink); }
.dots i.lie { background: var(--red); }
.stampbig { position: fixed; left: 50%; top: 40%; z-index: 40; font: 700 64px/1 var(--font-d); color: var(--red); border: 6px solid var(--red); border-radius: 10px; padding: 6px 22px; transform: translate(-50%, -50%) rotate(-12deg) scale(2.4); opacity: 0; pointer-events: none; letter-spacing: .08em; background: rgba(11,10,9,.6); }
.stampbig.go { animation: stampgo 1.3s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes stampgo { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(2.4); } 25% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(1); } }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { padding: 0 10px; font-size: 16px; letter-spacing: .05em; white-space: nowrap; }
.accuse { animation: glow 1.4s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(224,64,47,.25); } }
.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px); opacity: 0; z-index: 35; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); padding: 10px 16px; border-radius: 12px; font: 700 15px var(--font-d); letter-spacing: .03em; transition: .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== Финал ===== */
#end { align-items: center; justify-content: center; text-align: center; gap: 16px; overflow-y: auto; }
.verdict { font: 700 46px/1 var(--font-d); letter-spacing: .08em; color: var(--red); border: 5px solid var(--red); border-radius: 10px; padding: 8px 20px; transform: rotate(-8deg); animation: stampgo2 .6s cubic-bezier(.2,1.6,.4,1) both; }
.verdict.fail { color: var(--muted); border-color: var(--muted); }
@keyframes stampgo2 { from { transform: rotate(-8deg) scale(2.5); opacity: 0; } }
.stars { font-size: 42px; color: var(--gold); letter-spacing: 6px; }
.endtxt { font: 500 15px/1.45 var(--mono); color: var(--muted); max-width: 380px; }
.endtxt b { color: var(--ink); }
.share { width: min(100%, 380px); white-space: pre-wrap; text-align: left; font: 500 14px/1.45 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.next { font: 500 12px var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.next b { display: block; font: 700 28px var(--mono); color: var(--ink); letter-spacing: .04em; }
#end .btn { width: min(100%, 380px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
