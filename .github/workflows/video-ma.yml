# Видео для сайта «М.А»: забрать исходник из public_html/upload на хостинге, сжать для сайта и положить в репозиторий.
# Запуск: изменить файл demos/monro-beauty/video-fetch.txt (пуш в ветку).
name: Видео М.А — сжать
on:
  push:
    branches: [claude/low-code-business-ideas-0dr8l2]
    paths: [demos/monro-beauty/video-fetch.txt]
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: vh480.timeweb.ru
      FTP_USER: cp858271_deploy
    steps:
      - uses: actions/checkout@v4
      - name: Забрать исходник с хостинга
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp ffmpeg >/dev/null
          mkdir -p src
          lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2; cls -l public_html/upload/; mirror --verbose=1 public_html/upload/ src/; bye"
          ls -la src
          f=$(ls -S src | head -1); test -n "$f" || { echo "В public_html/upload нет файлов"; exit 1; }
          echo "SRC=src/$f" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of compact "src/$f"
      - name: Сжать
        run: |
          mkdir -p demos/monro-beauty/video
          # 1080 по длинной стороне не больше, звук оставляем тихим AAC, быстрый старт в браузере
          VF="scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(iw,ih),-2,min(1920,ih))',fps=30"
          ffmpeg -y -v error -i "$SRC" -vf "$VF" -c:v libx264 -preset slow -crf 26 -profile:v high -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart demos/monro-beauty/video/ma.mp4
          ffmpeg -y -v error -i "$SRC" -vf "$VF" -c:v libvpx-vp9 -crf 34 -b:v 0 -row-mt 1 -deadline good -cpu-used 2 -c:a libopus -b:a 64k demos/monro-beauty/video/ma.webm
          ffmpeg -y -v error -ss 1 -i "$SRC" -vf "$VF" -frames:v 1 -q:v 3 demos/monro-beauty/video/ma-poster.jpg
          for s in 2 6 12 20 30; do ffmpeg -y -v error -ss $s -i "$SRC" -vf "scale=480:-2" -frames:v 1 demos/monro-beauty/video/frame-$s.jpg || true; done
          ls -la demos/monro-beauty/video
          ffprobe -v error -show_entries format=duration:stream=width,height -of compact demos/monro-beauty/video/ma.mp4
      - name: Сохранить в репозиторий и убрать исходник с хостинга
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add demos/monro-beauty/video
          git commit -m "М.А: видео для сайта (сжато из исходника)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; rm -r public_html/upload; bye" || true
