# Выкладка сайта «М.А» с ботом на хостинг (Timeweb). Запускается сама при изменениях сайта в ветке.
# Нужны секреты репозитория: BOT_TOKEN, ADMIN_KEY, FTP_PASSWORD, CABINET_PASS (пароль кабинета). В логах они не печатаются.
name: Выложить сайт М.А
on:
  push:
    branches: [claude/low-code-business-ideas-0dr8l2]
    paths: [docs/monro/**, demos/monro-beauty/server/**, .github/workflows/deploy-ma.yml, demos/monro-beauty/deploy.txt]
  workflow_dispatch:
    inputs:
      dir:
        description: Папка сайта на хостинге
        default: public_html
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE: http://cp858271.tw1.ru
      DOMAIN: ma-nails.ru
      FTP_HOST: vh480.timeweb.ru
      FTP_USER: cp858271_deploy
    steps:
      - name: Есть ли секреты
        id: chk
        env:
          OK: ${{ secrets.BOT_TOKEN != '' && secrets.ADMIN_KEY != '' && secrets.FTP_PASSWORD != '' }}
        run: |
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          [ "$OK" = true ] || echo "::notice::Секреты ещё не добавлены — выкладка пропущена"
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'
      - name: Собрать
        if: steps.chk.outputs.ok == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CABINET_PASS: ${{ secrets.CABINET_PASS }}
        run: |
          test -n "$BOT_TOKEN" && test ${#ADMIN_KEY} -ge 16 || { echo "Нет секретов BOT_TOKEN или ADMIN_KEY (не короче 16 символов)"; exit 1; }
          mkdir out && cp -r docs/monro/. out/
          sed -i 's#var API = ""#var API = "/server/api.php"#' out/index.html
          grep -q 'var API = "/server/api.php"' out/index.html
          # письма клиенткам — только когда у домена работает почта (файл demos/monro-beauty/mail-on)
          [ -f demos/monro-beauty/mail-on ] || sed -i 's#var MAIL_REMIND = true;#var MAIL_REMIND = false;#' out/index.html
          # сжать код страницы (пробелы, комментарии); имена в коде не трогаем
          npx --yes html-minifier-terser@7.2.0 --collapse-whitespace --conservative-collapse --remove-comments --minify-css true --minify-js '{"mangle":false,"compress":false}' -o out/index.min.html out/index.html
          grep -q 'API="/server/api.php"' out/index.min.html && mv out/index.min.html out/index.html
          ls -l out/index.html
          mkdir out/server && cp demos/monro-beauty/server/*.php demos/monro-beauty/server/.htaccess out/server/ && rm -f out/server/config.php
          php -r 'file_put_contents("out/server/config.php", "<?php return " . var_export([
            "bot_token" => getenv("BOT_TOKEN"), "bot_name" => "ma_mihaylovka_bot", "admin_key" => getenv("ADMIN_KEY"), "cabinet_pass" => getenv("CABINET_PASS") ?: "", "mail_from" => file_exists("demos/monro-beauty/mail-on") ? "marina@" . getenv("DOMAIN") : "", "mail_admin" => "",
            "site_url" => (file_exists("demos/monro-beauty/https-on") ? "https://" : "http://") . getenv("DOMAIN") . "/", "allow_origin" => "https://" . getenv("DOMAIN") . ",http://" . getenv("DOMAIN") . "," . getenv("SITE"),
            "db_path" => "__DB__", "tz" => "Europe/Volgograd", "tg_api" => "https://api.telegram.org"], true) . ";\n");'
          sed -i "s#'__DB__'#__DIR__ . '/data/bot.sqlite'#" out/server/config.php
          php -l out/server/config.php
          # .htaccess сайта: сжатие, кэш картинок и шрифтов, и (когда выпущен сертификат) переход на https://ma-nails.ru
          cat > out/.htaccess <<'HT'
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
          </IfModule>
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/webp "access plus 30 days"
            ExpiresByType image/png "access plus 30 days"
            ExpiresByType image/jpeg "access plus 30 days"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType text/html "access plus 0 seconds"
          </IfModule>
          <IfModule mod_headers.c>
            <FilesMatch "\.html$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          HT
          sed -i 's/^          //' out/.htaccess
          if [ -f demos/monro-beauty/https-on ]; then
            printf '%s\n' 'RewriteEngine On' \
              'RewriteCond %{REQUEST_URI} !^/server/' \
              'RewriteCond %{HTTP:X-Forwarded-Proto} !https [OR]' \
              "RewriteCond %{HTTP_HOST} !^${DOMAIN}\$ [NC]" \
              "RewriteRule ^ https://${DOMAIN}%{REQUEST_URI} [R=301,L]" >> out/.htaccess
          fi
          cat out/.htaccess
      - name: Загрузить по FTP
        if: steps.chk.outputs.ok == 'true'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ inputs.dir || 'public_html' }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2; set net:reconnect-interval-base 5; cls -l $DIR/; rm -f $DIR/index.htm $DIR/index.php $DIR/index.shtml $DIR/default.htm; mirror -R --verbose=1 --exclude-glob server/data/ out/ $DIR/; cls -l $DIR/; bye"
      - name: Проверить
        if: steps.chk.outputs.ok == 'true'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/")
          echo "Сайт: $code"
          curl -s "$SITE/" | grep -o '<title>[^<]*' || true
          echo "--- https://${DOMAIN} ---"
          curl -s -o /dev/null -m 20 -w 'https: код %{http_code}, проверка сертификата %{ssl_verify_result} (0 = в порядке)\n' "https://${DOMAIN}/" || echo "https: не отвечает"
          echo | timeout 20 openssl s_client -connect "${DOMAIN}:443" -servername "${DOMAIN}" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null || echo "сертификат: не найден"
          curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip' "$SITE/" | grep -i 'content-encoding\|cache-control' || echo "сжатие: нет"
          curl -s -o /dev/null -D - "$SITE/fonts/manrope-cyrillic.woff2" | grep -i 'HTTP/\|expires\|cache-control'
          curl -s -X POST "$SITE/server/api.php" -H 'Content-Type: application/json' -d '{"type":"x"}'; echo
          curl -s --max-time 60 "$SITE/server/poll.php?key=$ADMIN_KEY&diag=1"
          curl -s --max-time 60 "$SITE/server/poll.php?key=$ADMIN_KEY"
          curl -s --max-time 60 "$SITE/server/poll.php?key=$ADMIN_KEY&diag=1" | tail -n +4
      - name: Очистить уведомления или тестовые данные кабинета
        if: steps.chk.outputs.ok == 'true' && (contains(github.event.head_commit.message, '[clear-notes]') || contains(github.event.head_commit.message, '[clear-data]') || contains(github.event.head_commit.message, '[clear-cancelled]'))
        env:
          CABINET_PASS: ${{ secrets.CABINET_PASS }}
          CLEAR_DATA: ${{ contains(github.event.head_commit.message, '[clear-data]') && '1' || '0' }}
          CLEAR_CANC: ${{ contains(github.event.head_commit.message, '[clear-cancelled]') && '1' || '0' }}
        run: |
          A="$SITE/server/api.php"
          T=$(php -r 'echo json_encode(["type" => "login", "pass" => getenv("CABINET_PASS")]);' | curl -s -X POST "$A" --data-binary @- | php -r '$r = json_decode(stream_get_contents(STDIN), true); echo $r["token"] ?? "";')
          test -n "$T" || { echo "Не удалось войти в кабинет"; exit 1; }
          echo "::add-mask::$T"
          curl -s -X POST "$A" -d "{\"type\":\"sync\",\"token\":\"$T\",\"ops\":[{\"p\":[\"notes\"],\"v\":[]}]}" | php -r '$r = json_decode(stream_get_contents(STDIN), true); echo "Уведомлений осталось: " . count($r["doc"]["notes"] ?? []) . "\n";'
          if [ "$CLEAR_DATA" = "1" ]; then
            OPS='[{"p":["bookings"],"v":[]},{"p":["training"],"v":[]},{"p":["certs"],"v":[]},{"p":["notes"],"v":[]},{"p":["modelBase"],"v":[]},{"p":["models"],"v":{}},{"p":["modelTimes"],"v":{}},{"p":["deleted"],"v":{}}]'
            curl -s -X POST "$A" -d "{\"type\":\"sync\",\"token\":\"$T\",\"ops\":$OPS}" | php -r '$r = json_decode(stream_get_contents(STDIN), true); $d = $r["doc"] ?? []; echo "Осталось: записей " . count($d["bookings"] ?? []) . ", обучений " . count($d["training"] ?? []) . ", сертификатов " . count($d["certs"] ?? []) . "\n";'
          fi
          if [ "$CLEAR_CANC" = "1" ]; then  # убрать отменённые (тестовые) записи — из списка и статистики
            export T
            curl -s -X POST "$A" -d "{\"type\":\"state\",\"token\":\"$T\"}" | php -r '$r = json_decode(stream_get_contents(STDIN), true); $b = array_values(array_filter($r["doc"]["bookings"] ?? [], fn($x) => ($x["status"] ?? "") !== "cancelled")); echo json_encode(["type" => "sync", "token" => getenv("T"), "ops" => [["p" => ["bookings"], "v" => $b]]], JSON_UNESCAPED_UNICODE);' > ops.json
            curl -s -X POST "$A" --data-binary @ops.json | php -r '$r = json_decode(stream_get_contents(STDIN), true); echo "Записей осталось: " . count($r["doc"]["bookings"] ?? []) . "\n";'; rm -f ops.json
          fi
          curl -s -X POST "$A" -d "{\"type\":\"logout\",\"token\":\"$T\"}"; echo
